[package]
name = "classroom-cli"
version = "0.2.0"
edition = "2024"
description = "Google Classroom from the terminal: list, fetch and turn in assignments"

[[bin]]
name = "class"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
console = "0.15"
deunicode = "1"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
dirs = "6"
ignore = "0.4"
indicatif = "0.17"
mime_guess = "2"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
